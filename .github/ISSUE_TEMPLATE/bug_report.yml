name: "🐛 Bug Report"
description: "Report an issue, defect, or unexpected behavior in SparData"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: SparData Version & OS
      description: What version of SparData and OS (macOS, Windows, Linux) are you using?
      placeholder: "e.g., SparData 0.1.0 on macOS Sequoia (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When opening the visual DAG editor on a job with CustomCode nodes..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open job 'orders-etl'
        2. Click on 'Run locally'
        3. See error in console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any error messages, terminal output, or logs.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have verified this is not already reported in existing issues.
          required: true
        - label: I ran `make check` if testing from source.
          required: false
